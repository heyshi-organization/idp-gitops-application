# サンプルアプリ本体。manifests/sample-app/ をそのまま同期する。
# dev-team AppProjectに属するため、destination/リソース種別はAppProjectで制限されている
# (platform/argocd-bootstrap/dev-team-appproject.yaml参照)。
# Namespaceはdev-team自身では作れない(Platform teamが platform/rbac/dev-team-namespace.yaml で用意する)
# ため、CreateNamespace=trueは付けていない。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
spec:
  project: dev-team
  source:
    repoURL: https://github.com/<GitHubユーザー名>/develop-pe-env.git
    targetRevision: main
    path: manifests/sample-app
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
