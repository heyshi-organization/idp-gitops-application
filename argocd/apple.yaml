# サンプルアプリ本体。このリポジトリの manifests/apple/ をそのまま同期する。
#
# ★metadata.namespace について
# このApplication CRは argocd ではなく、チームのワークロードNamespaceに置く。
# 理由: Argo CDには「argocd Namespaceに置かれたApplicationはAppProjectの sourceNamespaces
# 制約を受けず、任意のAppProjectを参照できる」という後方互換仕様がある。そのため argocd に
# 置くと project: platform-services 等と書くだけで権限昇格できてしまう。
# チームのNamespaceに置き、alpha-workloads AppProjectの sourceNamespaces で縛ることで、
# このApplicationが alpha-workloads AppProject以外を参照できないようにしている。
#
# ここを argocd にすると alpha-apps AppProjectの destinations 制約(チームのNamespaceのみ)に
# 違反し、Argo CDに拒否される(黙って argocd に作られるより、エラーで気づける方が安全という設計)。
#
# ★alpha-apps と alpha-workloads の役割分担(プラットフォームチームが管理)
#   alpha-apps      … このリポジトリの argocd/ に何を置けるか        = Application CR のみ
#   alpha-workloads … そのApplicationが何を作れるか(下の project:) = Deployment/Service/ConfigMap
#
# ★Namespace命名規則: ns-gitops-team-<チーム名>-sys-<システム名>
# Namespaceはプロダクトチーム自身では作れない(クラスタスコープ操作のため
# clusterResourceWhitelist: [] で禁止されている)。プラットフォームチームが
# idp-gitops-platform リポジトリの gitops/teams/<チーム名>/manifests/namespaces/<システム名>/ で
# 払い出す。そのため CreateNamespace=true は付けていない。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apple
  namespace: ns-gitops-team-alpha-sys-apple
spec:
  project: alpha-workloads
  source:
    repoURL: https://github.com/heyshi-organization/idp-gitops-application.git
    targetRevision: main
    path: manifests/apple
  destination:
    server: https://kubernetes.default.svc
    namespace: ns-gitops-team-alpha-sys-apple
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
