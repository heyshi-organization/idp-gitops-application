apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apple
  labels:
    app: apple
    # kube-prometheus-stackは既定でrelease: <Helmリリース名>のServiceMonitorだけを拾う
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: apple
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
